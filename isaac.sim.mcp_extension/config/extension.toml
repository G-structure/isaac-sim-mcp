[package]
name = "isaac_sim_mcp_extension"
version = "0.3.0"
title = "Isaac Sim MCP Server"
description = "MCP server extension for Isaac Sim to enable communication with Claude and other AI assistants"
category = "Robotics"
keywords = ["mcp", "server", "socket", "simulation", "robotics"]

[dependencies]
# Isaac-specific deps are OPTIONAL and span both naming schemes so the extension
# loads on Isaac Sim 5.1 (omni.isaac.*) AND 6.0+ (isaacsim.*). Isaac Sim 6.0
# renamed omni.isaac.core/omni.isaac.ui to isaacsim.core.api/isaacsim.gui.components;
# a HARD dep on the old names made Kit's solver abort the whole app at startup
# ("No versions of omni.isaac.core ... (none found)" -> "Exiting app because of
# dependency solver failure"), so Isaac never rendered and CUA screenshots were
# black. Runtime code imports only omni.kit.*/omni.usd/omni.graph (omni.isaac.core
# imports live in examples/, which Kit does not load), so these are safe optional.
"omni.kit.uiapp" = {}
"omni.isaac.core" = { optional = true }
"omni.isaac.ui" = { optional = true }
"isaacsim.core.api" = { optional = true }
"isaacsim.gui.components" = { optional = true }



# Main python module this extension provides, it will be publicly available as "import isaac_sim_mcp_extension".
[[python.module]]
name = "isaac_sim_mcp_extension"



[python.pipapi]


[settings]
server.socket = 8766
server.host = "localhost"
